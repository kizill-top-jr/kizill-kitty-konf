# =====================================================
#  KITTY + pywal
# =====================================================

# ──────────────── THEME ────────────────
include ~/.cache/wal/colors-kitty.conf

# ──────────────── COLORS ────────────────
background_opacity 0.45
background_blur 30
background_tint 0.1
dim_opacity 0.85

# ──────────────── FONT ────────────────
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# ──────────────── WINDOW ────────────────
window_padding_width    5 5
window_border_width     0
draw_minimal_borders    yes
remember_window_size    yes
initial_window_width    960
initial_window_height   540
window_margin_width     0
single_window_margin_width 0
hide_window_decorations yes
confirm_os_window_close 0
window_resize_step_cells 2
window_resize_step_lines 2

# ──────────────── SCROLLBACK AND BUFFER ────────────────
scrollback_lines        20000
scrollback_pager_history_size 100
scrollback_fill_enlarged_window yes
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 1.0
touch_scroll_multiplier 1.0

# ──────────────── CURSOR ────────────────
cursor_shape              beam
cursor_beam_thickness     1.6
cursor_blink_interval      0.4
cursor_stop_blinking_after 15.0
cursor_underline_thickness 2.0
cursor_shape_unfocused    hollow
# Cursor with trail
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 1

# ──────────────── MOUSE ────────────────
mouse_hide_wait 3.0
url_prefixes http https file ftp
copy_on_select no
strip_trailing_spaces smart
rectangle_select_modifiers ctrl+alt
terminal_select_modifiers shift

# ──────────────── SOUND / MISC ────────────────
enable_audio_bell no
force_ltr         no
visual_bell_duration 0.0
notify_on_cmd_finish never

# ──────────────── SHELL INTEGRATION ────────────────
shell_integration enabled
allow_hyperlinks yes
shell zsh

# ──────────────── TABS ────────────────
# Colors are overridden by pywal via colors-kitty.conf
# Here is only structure and behavior
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_align             center
tab_bar_min_tabs          1
tab_switch_strategy       previous
tab_title_template " {fmt.fg.tab}{'' if 'nvim' in title else '' if 'emerge' in title else '' if 'htop' in title else '' if 'btop' in title else '' if 'python' in title else '' if 'node' in title else '' if 'docker' in title else '' if 'git' in title else '' if 'mpv' in title or 'cmus' in title else '' if 'tmux' in title or 'screen' in title else '' if 'ssh' in title else '' if 'make' in title or 'cargo' in title else '' if 'nano' in title or 'vim' in title else ''} {index}: {title} "
tab_bar_margin_height     0.0 0.0
tab_separator             ""
tab_title_max_length      28

# ──────────────── RENDERING ────────────────
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ──────────────── KEYBINDINGS ────────────────
map ctrl+shift+t        new_tab
map ctrl+shift+q        close_tab
map ctrl+shift+left     prev_tab
map ctrl+shift+right    next_tab
map ctrl+shift+enter    new_window
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window
map ctrl+shift+w        close_window
map ctrl+shift+equal    change_window_size yes
map ctrl+shift+minus    change_window_size no
map ctrl+shift+f        search
map ctrl+shift+plus     change_font_size all +1.0
map ctrl+shift+0        change_font_size all 0
map ctrl+shift+l        next_layout

# ──────────────── WAYLAND ────────────────
wayland_enable_ime yes
